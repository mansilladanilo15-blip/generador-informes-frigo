<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 8px;
      color: #555;
    }
    #footer-wrap {
      padding: 0 0 5px 0;
      margin: 0;
    }
    .footer-contenedor {
      width: 100%;
      border-top: 1px solid #c5cdd6;
      padding-top: 4px;
    }
    .footer-contenedor table {
      width: 100%;
      border-collapse: collapse;
    }
    .izq {
      text-align: left;
      font-size: 7px;
      color: #999;
    }
    .der {
      text-align: right;
      font-size: 8px;
      font-weight: 600;
      color: #1a4d8f;
    }
  </style>
</head>
<body>
  <div id="footer-wrap">
    <div class="footer-contenedor">
      <table>
        <tr>
          <td class="izq">{{empresa}} — Documento interno</td>
          <td class="der">Página </td>
        </tr>
      </table>
    </div>
  </div>
</body>
</html>
